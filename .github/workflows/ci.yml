name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: lint
        run: deno lint
      - name: type-check
        run: deno check feeds/*/*.ts feeds/*/*.test.ts publish/*.ts publish/*.test.ts
      - name: test
        run: deno task test
      - name: the mutation runner's own suite
        run: deno task test:mutation-runner
      - name: mutation
        run: deno task mutation
