name: Mutation score

# `mutations.json` is a CURATED set -- seventeen changes a person thought of --
# and the suite catches all seventeen. A perfect result against a list you wrote
# proves your imagination and your tests agree. They always do.
#
# Stryker generates 1,581 mutants from the syntax tree instead, and scores this
# project rather lower. That number is published in the README, where a reviewer
# can check it, rather than left for them to discover.
#
# The `--allow-env` grant below is worth reading. This project's suite runs with
# NO permissions at all -- `deno test` bare, which is what makes the "no I/O"
# claim in the README checkable rather than merely stated. The sandbox is tight
# enough that Stryker could not read its OWN mutant-selector variable: the dry
# run failed with `NotCapable: Requires env access to
# "__STRYKER_ACTIVE_MUTANT__"`.
#
# That grant lives in the committed `stryker.conf.json`, which is the same file
# `npx stryker run` picks up from a clean clone -- this job writes no config of
# its own, so CI and a reviewer cannot measure different things.
#
# So exactly one named variable is granted and nothing else. Not `--allow-env`
# bare, and NOT `--allow-read`: a first version of this file granted read as
# well, which was an over-grant nobody needed and a poor look in the one
# repository whose argument is least privilege. Measured before it was removed --
# 268 tests pass with `--allow-env=__STRYKER_ACTIVE_MUTANT__` alone.
#
# The permission model refusing a tool this way is the model working.
on:
  schedule:
    - cron: '21 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: install the mutant generator
        run: npm i -D --no-save "@stryker-mutator/core@^9"
      - name: mutation score
        run: npx stryker run
